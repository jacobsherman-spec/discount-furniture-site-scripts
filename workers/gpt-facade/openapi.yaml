openapi: 3.1.0
info:
  title: Discount Furniture GPT Facade
  version: 0.2.0
servers:
  - url: https://discount-furniture-gpt-facade.jacobsherman.workers.dev
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health check and capability flags
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /categories/resolve:
    post:
      operationId: resolveCategory
      x-openai-isConsequential: false
      summary: Resolve category id from category name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product_category_name:
                  type: string
              required: [product_category_name]
              additionalProperties: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /products/preview-create:
    post:
      operationId: previewProductCreate
      x-openai-isConsequential: false
      summary: Preview product create (required before write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /products/create:
    post:
      operationId: createProduct
      x-openai-isConsequential: true
      summary: Create product (approval required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /variants/preview-create:
    post:
      operationId: previewVariantCreate
      x-openai-isConsequential: false
      summary: Preview variant product create (required before write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /variants/create:
    post:
      operationId: createVariant
      x-openai-isConsequential: true
      summary: Create variant product (approval required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
